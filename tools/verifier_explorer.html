<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifier Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0f1117;
    --surface: #1a1d27;
    --border:  #2a2d3e;
    --text:    #c9d1d9;
    --muted:   #6e7681;
    --accent:  #58a6ff;
    --green:   #3fb950;
    --red:     #f85149;
    --amber:   #d29922;
    --purple:  #bc8cff;
    --cyan:    #39d0d8;
    --pill-valid:   #1a3a2a;
    --pill-invalid: #3a1a1a;
  }

  html, body { height: 100%; font-family: 'JetBrains Mono', monospace; font-size: 13px; background: var(--bg); color: var(--text); }

  /* ── Layout ── */
  #app { display: grid; grid-template-columns: 300px 1fr; grid-template-rows: 48px 1fr; height: 100vh; }
  #toolbar { grid-column: 1 / -1; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; padding: 0 14px; }
  #sidebar { border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  #main { overflow-y: auto; padding: 20px; }

  /* ── Toolbar ── */
  #toolbar h1 { font-size: 14px; font-weight: 600; color: var(--accent); flex-shrink: 0; }
  #file-input { display: none; }
  .btn { background: var(--border); color: var(--text); border: 1px solid var(--muted); border-radius: 4px; padding: 4px 10px; cursor: pointer; font-family: inherit; font-size: 12px; }
  .btn:hover { background: var(--accent); color: var(--bg); }
  #stats-toggle { margin-left: auto; }

  /* ── Filters ── */
  #filters { padding: 8px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 5px; }
  #filters input, #filters select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 3px; padding: 4px 6px; font-family: inherit; font-size: 12px; width: 100%; }
  #filters select { appearance: none; }

  /* ── Task list ── */
  #task-list { flex: 1; overflow-y: auto; }
  .task-item { padding: 7px 10px; cursor: pointer; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 10px 1fr auto; gap: 6px; align-items: center; }
  .task-item:hover { background: var(--surface); }
  .task-item.active { background: #1c2333; }
  .task-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-pass { background: var(--green); }
  .dot-fail { background: var(--red); }
  .dot-na   { background: var(--muted); }
  .task-id { font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .cat-chip { font-size: 10px; background: var(--border); color: var(--muted); padding: 1px 5px; border-radius: 3px; white-space: nowrap; }

  /* ── Detail panel ── */
  .panel-section { margin-bottom: 18px; }
  .panel-section h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }

  /* Verdict pill */
  .verdict-pill { display: inline-block; padding: 3px 10px; border-radius: 3px; font-size: 12px; font-weight: 600; }
  .pill-valid   { background: var(--pill-valid);   color: var(--green); }
  .pill-invalid { background: var(--pill-invalid); color: var(--red); }

  /* Metric grid */
  .metric-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .metric-box { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 8px 10px; }
  .metric-box .label { font-size: 10px; color: var(--muted); }
  .metric-box .value { font-size: 14px; font-weight: 600; margin-top: 2px; }

  /* SVG graph */
  #graph-svg { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; min-height: 160px; display: block; }

  /* Violations */
  .violation-card { background: var(--surface); border: 1px solid #f851492a; border-left: 3px solid var(--red); border-radius: 4px; padding: 8px 10px; margin-bottom: 6px; font-size: 11px; }
  .violation-card .vtype { font-weight: 600; color: var(--red); }
  .violation-card .vlayer { color: var(--muted); font-size: 10px; margin-top: 2px; }
  .violation-card .vmsg  { color: var(--text); margin-top: 4px; word-break: break-word; }

  /* Relation table */
  table { width: 100%; border-collapse: collapse; font-size: 11px; }
  th { text-align: left; padding: 4px 6px; color: var(--muted); font-weight: 400; border-bottom: 1px solid var(--border); }
  td { padding: 4px 6px; border-bottom: 1px solid var(--border); }
  .row-match   { background: #1a3a2a22; }
  .row-missing { background: #3a1a1a22; color: var(--red); }
  .row-spurious{ background: #3a2a0a22; color: var(--amber); }

  /* Trace */
  .trace-step { display: flex; gap: 8px; margin-bottom: 6px; }
  .step-num { min-width: 22px; height: 22px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0; }
  .step-warn { background: var(--amber); color: var(--bg); }
  .step-body { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; font-size: 11px; flex: 1; white-space: pre-wrap; word-break: break-word; }

  /* Question block */
  #question-text { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; font-size: 12px; white-space: pre-wrap; word-break: break-word; line-height: 1.55; color: var(--text); max-height: 240px; overflow-y: auto; }

  /* Stats panel */
  #stats-panel { padding: 20px; }
  #stats-panel h2 { font-size: 14px; color: var(--accent); margin-bottom: 16px; }
  .stat-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 12px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  .stat-row .sk { color: var(--muted); }
  .bar-track { background: var(--border); border-radius: 2px; height: 14px; margin: 2px 0 6px; }
  .bar-fill  { background: var(--accent); border-radius: 2px; height: 14px; font-size: 9px; color: var(--bg); padding-left: 4px; line-height: 14px; overflow: hidden; white-space: nowrap; }

  /* Empty state */
  #empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--muted); gap: 10px; }
  #empty .hint { font-size: 11px; }
</style>
</head>
<body>
<div id="app">
  <!-- Toolbar -->
  <div id="toolbar">
    <h1>Verifier Explorer</h1>
    <label class="btn" for="file-input">Load predictions.jsonl</label>
    <input type="file" id="file-input" accept=".jsonl,.json">
    <span id="load-status" style="font-size:11px;color:var(--muted)"></span>
    <button class="btn" id="stats-toggle">Statistics</button>
  </div>

  <!-- Sidebar -->
  <div id="sidebar">
    <div id="filters">
      <input type="text" id="search-input" placeholder="Search id or question…">
      <select id="cat-filter"><option value="">All categories</option></select>
      <select id="verdict-filter">
        <option value="">All verdicts</option>
        <option value="valid">is_valid = true</option>
        <option value="invalid">is_valid = false</option>
      </select>
    </div>
    <div id="task-list"></div>
  </div>

  <!-- Main panel -->
  <div id="main">
    <div id="empty">
      <div>No file loaded.</div>
      <div class="hint">Click "Load predictions.jsonl" to open a run output.</div>
    </div>
    <div id="stats-panel" style="display:none"></div>
    <div id="detail-panel" style="display:none"></div>
  </div>
</div>

<script>
/* ─────────────────────────────────────────────────────────────────
   State
───────────────────────────────────────────────────────────────── */
let ALL_TASKS = [];
let ACTIVE_IDX = null;
let SHOW_STATS = false;

/* ─────────────────────────────────────────────────────────────────
   File loading
───────────────────────────────────────────────────────────────── */
document.getElementById('file-input').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const lines = ev.target.result.split('\n').filter(l => l.trim());
    ALL_TASKS = [];
    let errors = 0;
    for (const line of lines) {
      try { ALL_TASKS.push(JSON.parse(line)); } catch (_) { errors++; }
    }
    document.getElementById('load-status').textContent =
      `${ALL_TASKS.length} tasks loaded` + (errors ? ` (${errors} parse errors)` : '');
    populateCategoryFilter();
    renderList();
    SHOW_STATS = false;
    showPanel('list');
    this.value = '';
  }.bind(this);
  reader.readAsText(file);
});

/* ─────────────────────────────────────────────────────────────────
   Filters
───────────────────────────────────────────────────────────────── */
function populateCategoryFilter() {
  const cats = [...new Set(ALL_TASKS.map(t => t.category || ''))].sort();
  const sel = document.getElementById('cat-filter');
  sel.innerHTML = '<option value="">All categories</option>';
  cats.forEach(c => {
    if (!c) return;
    const o = document.createElement('option');
    o.value = c; o.textContent = c;
    sel.appendChild(o);
  });
}

function filteredTasks() {
  const q  = document.getElementById('search-input').value.toLowerCase();
  const cat = document.getElementById('cat-filter').value;
  const verdict = document.getElementById('verdict-filter').value;
  return ALL_TASKS.map((t, i) => ({ t, i })).filter(({ t }) => {
    if (cat && t.category !== cat) return false;
    if (verdict === 'valid'   && !t.verification?.is_valid) return false;
    if (verdict === 'invalid' && t.verification?.is_valid)  return false;
    if (q && !String(t.id || '').toLowerCase().includes(q) &&
             !String(t.question || '').toLowerCase().includes(q)) return false;
    return true;
  });
}

['search-input','cat-filter','verdict-filter'].forEach(id => {
  document.getElementById(id).addEventListener('input', renderList);
});

/* ─────────────────────────────────────────────────────────────────
   Task list
───────────────────────────────────────────────────────────────── */
function dotClass(task) {
  if (!task.gold_relations || task.gold_relations.length === 0) return 'dot-na';
  const correct = task.score?.direct?.correct ?? 0;
  return correct > 0 ? 'dot-pass' : 'dot-fail';
}

function renderList() {
  const container = document.getElementById('task-list');
  const items = filteredTasks();
  container.innerHTML = '';
  if (!items.length) {
    container.innerHTML = '<div style="padding:10px;color:var(--muted);font-size:11px">No tasks match.</div>';
    return;
  }
  items.forEach(({ t, i }) => {
    const el = document.createElement('div');
    el.className = 'task-item' + (i === ACTIVE_IDX ? ' active' : '');
    el.dataset.idx = i;
    el.innerHTML =
      `<span class="task-dot ${dotClass(t)}"></span>` +
      `<span class="task-id" title="${esc(t.id || '')}">${esc(t.id || '(no id)')}</span>` +
      `<span class="cat-chip">${esc(t.category || '—')}</span>`;
    el.addEventListener('click', () => selectTask(i));
    container.appendChild(el);
  });
}

function selectTask(idx) {
  ACTIVE_IDX = idx;
  SHOW_STATS = false;
  renderList();
  showPanel('detail');
  renderDetail(ALL_TASKS[idx]);
}

/* ─────────────────────────────────────────────────────────────────
   Panel switching
───────────────────────────────────────────────────────────────── */
function showPanel(which) {
  document.getElementById('empty').style.display = 'none';
  document.getElementById('stats-panel').style.display = 'none';
  document.getElementById('detail-panel').style.display = 'none';
  if (which === 'detail') document.getElementById('detail-panel').style.display = '';
  else if (which === 'stats') document.getElementById('stats-panel').style.display = '';
  else document.getElementById('empty').style.display = '';
}

document.getElementById('stats-toggle').addEventListener('click', () => {
  if (!ALL_TASKS.length) return;
  SHOW_STATS = !SHOW_STATS;
  if (SHOW_STATS) { renderStats(); showPanel('stats'); }
  else if (ACTIVE_IDX !== null) showPanel('detail');
  else showPanel('empty');
});

/* ─────────────────────────────────────────────────────────────────
   Detail panel
───────────────────────────────────────────────────────────────── */
function renderDetail(task) {
  const v = task.verification || {};
  const score = task.score || {};
  const direct = score.direct || {};
  const closure = score.closure || {};

  const verdictClass = v.is_valid ? 'pill-valid' : 'pill-invalid';
  const verdictText  = v.is_valid ? 'VALID' : 'INVALID';

  // violation count
  const vc = v.violation_counts || {};
  const violationTotal = Object.values(vc).reduce((s, n) => s + n, 0);

  const metrics = [
    ['Verdict',          `<span class="verdict-pill ${verdictClass}">${verdictText}</span>`],
    ['Trace grounded',   v.trace_grounded ? '<span style="color:var(--green)">yes</span>' : '<span style="color:var(--red)">no</span>'],
    ['Violations',       String(violationTotal)],
    ['First viol. step', v.first_violation_step != null ? String(v.first_violation_step) : '—'],
    ['Direct F1',        fmtF1(direct.f1)],
    ['Closure F1',       fmtF1(closure.f1)],
  ];

  const metricsHtml = metrics.map(([l, v]) =>
    `<div class="metric-box"><div class="label">${l}</div><div class="value">${v}</div></div>`
  ).join('');

  const graphSvg = buildGraphSvg(task, v);
  const violationsHtml = renderViolations([...(v.violations || []), ...(v.formula_violations || [])]);
  const relTableHtml = renderRelTable(task);
  const traceHtml = renderTrace(task, v);
  const questionHtml = `<div id="question-text">${esc(task.question || '(no question)')}</div>`;

  document.getElementById('detail-panel').innerHTML = `
    <div class="panel-section">
      <h3>Task — ${esc(task.id || '?')} &nbsp;·&nbsp; ${esc(task.category || '—')}</h3>
      <div class="metric-grid">${metricsHtml}</div>
    </div>
    <div class="panel-section">
      <h3>Temporal Graph</h3>
      ${graphSvg}
    </div>
    ${(v.violations?.length || v.formula_violations?.length) ? `
    <div class="panel-section">
      <h3>Violations (${(v.violations||[]).length + (v.formula_violations||[]).length})</h3>
      ${violationsHtml}
    </div>` : ''}
    <div class="panel-section">
      <h3>Gold vs Predicted Relations</h3>
      ${relTableHtml}
    </div>
    ${task.reasoning_steps?.length ? `
    <div class="panel-section">
      <h3>Reasoning Trace (${task.reasoning_steps.length} steps)</h3>
      ${traceHtml}
    </div>` : ''}
    <div class="panel-section">
      <h3>Question</h3>
      ${questionHtml}
    </div>
  `;
}

/* ── Graph SVG ── */
function buildGraphSvg(task, v) {
  const events = task.events || [];
  const predEdges = task.pred_edges || [];
  if (!events.length) return '<svg id="graph-svg" height="60"><text x="10" y="30" fill="#6e7681" font-size="11">No events</text></svg>';

  const n = events.length;
  const W = 700, nodeR = 22, yBase = 80, yStep = 90;
  const cols = Math.min(n, 5);
  const rows = Math.ceil(n / cols);
  const H = Math.max(160, rows * yStep + 40);
  const colW = W / (cols + 1);

  // Node positions
  const pos = {};
  events.forEach((e, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    pos[e] = { x: colW * (col + 1), y: yBase + row * yStep };
  });

  // Identify contradicting edges
  const violations = [...(v.violations || []), ...(v.formula_violations || [])];
  const hasContradiction = violations.some(vi =>
    vi.type === 'contradiction' || vi.type === 'ltl_contradiction' ||
    vi.type === 'cycle' || vi.type === 'temporal_inconsistency'
  );

  const edgeColor = { BEFORE: '#58a6ff', AFTER: '#bc8cff', SIMULTANEOUS: '#3fb950', UNKNOWN: '#6e7681' };

  function edgeKey(a, b) { return `${a}|||${b}`; }
  const goldSet = new Set((task.gold_relations || []).map(([a, b]) => edgeKey(a, b)));

  let edgesHtml = '';
  predEdges.forEach(([src, tgt, rel]) => {
    const sp = pos[src], tp = pos[tgt];
    if (!sp || !tp) return;
    const colour = hasContradiction ? '#f85149' : (edgeColor[rel] || '#6e7681');
    const isDashed = rel === 'SIMULTANEOUS';
    const strokeDash = isDashed ? 'stroke-dasharray="5,3"' : '';
    const mx = (sp.x + tp.x) / 2, my = (sp.y + tp.y) / 2 - 18;
    edgesHtml += `
      <line x1="${sp.x}" y1="${sp.y}" x2="${tp.x}" y2="${tp.y}"
            stroke="${colour}" stroke-width="1.5" ${strokeDash} marker-end="url(#arrowhead)" opacity="0.75"/>
      <text x="${mx}" y="${my}" text-anchor="middle" fill="${colour}" font-size="9" font-family="JetBrains Mono,monospace">${esc(rel)}</text>`;
  });

  let nodesHtml = events.map(e => {
    const p = pos[e];
    return `<circle cx="${p.x}" cy="${p.y}" r="${nodeR}" fill="#1a1d27" stroke="#2a2d3e" stroke-width="1.5"/>
            <text x="${p.x}" y="${p.y + 4}" text-anchor="middle" fill="#c9d1d9" font-size="9"
                  font-family="JetBrains Mono,monospace">${esc(truncate(e, 14))}</text>`;
  }).join('');

  return `<svg id="graph-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="height:${H}px">
    <defs>
      <marker id="arrowhead" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
        <polygon points="0 0, 6 2, 0 4" fill="#6e7681"/>
      </marker>
    </defs>
    ${edgesHtml}
    ${nodesHtml}
  </svg>`;
}

/* ── Violations ── */
function renderViolations(violations) {
  if (!violations.length) return '<div style="color:var(--muted);font-size:11px">None</div>';
  return violations.map(vi => `
    <div class="violation-card">
      <div class="vtype">${esc(vi.type || '?')}</div>
      <div class="vlayer">layer: ${esc(vi.layer || '?')}</div>
      <div class="vmsg">${esc(vi.message || '')}</div>
    </div>`
  ).join('');
}

/* ── Relation table ── */
function renderRelTable(task) {
  const gold = task.gold_relations || [];
  const pred = task.pred_edges || [];

  function edgeKey(a, b, r) { return `${a}|||${b}|||${r}`; }
  const goldKeys = new Set(gold.map(([a,b,r]) => edgeKey(a,b,r)));
  const predKeys = new Set(pred.map(([a,b,r]) => edgeKey(a,b,r)));
  const goldPairs = new Set(gold.map(([a,b]) => `${a}|||${b}`));
  const predPairs = new Set(pred.map(([a,b]) => `${a}|||${b}`));

  const rows = [];

  // Gold rows
  gold.forEach(([a,b,r]) => {
    const matched = predKeys.has(edgeKey(a,b,r));
    rows.push({ cls: matched ? 'row-match' : 'row-missing', src: a, tgt: b, rel: r, badge: matched ? '✓ match' : '✗ missing' });
  });

  // Spurious pred rows
  pred.forEach(([a,b,r]) => {
    if (!goldKeys.has(edgeKey(a,b,r))) {
      rows.push({ cls: 'row-spurious', src: a, tgt: b, rel: r, badge: '△ spurious' });
    }
  });

  if (!rows.length) return '<div style="color:var(--muted);font-size:11px">No relations (empty gold and pred).</div>';

  const body = rows.map(({ cls, src, tgt, rel, badge }) =>
    `<tr class="${cls}"><td>${esc(src)}</td><td>${esc(tgt)}</td><td>${esc(rel)}</td><td style="color:var(--muted);font-size:10px">${badge}</td></tr>`
  ).join('');

  return `<table><thead><tr><th>SOURCE</th><th>TARGET</th><th>RELATION</th><th></th></tr></thead><tbody>${body}</tbody></table>`;
}

/* ── Reasoning trace ── */
function renderTrace(task, v) {
  const steps = task.reasoning_steps || [];
  const warnStep = v.first_violation_step;
  return steps.map(step => {
    const isWarn = warnStep != null && step.step_id === warnStep;
    return `<div class="trace-step">
      <span class="step-num ${isWarn ? 'step-warn' : ''}" title="${isWarn ? 'First violation' : ''}">${step.step_id ?? '?'}</span>
      <div class="step-body">${esc(step.text || '')}</div>
    </div>`;
  }).join('');
}

/* ─────────────────────────────────────────────────────────────────
   Statistics panel
───────────────────────────────────────────────────────────────── */
function renderStats() {
  const n = ALL_TASKS.length;
  if (!n) return;

  const valid = ALL_TASKS.filter(t => t.verification?.is_valid).length;
  const validRate = (valid / n * 100).toFixed(1);

  const directF1s = ALL_TASKS.map(t => t.score?.direct?.f1).filter(v => v != null);
  const closureF1s = ALL_TASKS.map(t => t.score?.closure?.f1).filter(v => v != null);
  const avgDirect  = directF1s.length  ? (directF1s.reduce((a,b)=>a+b,0) / directF1s.length).toFixed(3) : '—';
  const avgClosure = closureF1s.length ? (closureF1s.reduce((a,b)=>a+b,0) / closureF1s.length).toFixed(3) : '—';

  // Category distribution
  const catCounts = {};
  ALL_TASKS.forEach(t => {
    const c = t.category || '(none)';
    catCounts[c] = (catCounts[c] || 0) + 1;
  });
  const catMax = Math.max(...Object.values(catCounts));

  // Top violation types
  const vCounts = {};
  ALL_TASKS.forEach(t => {
    [...(t.verification?.violations || []), ...(t.verification?.formula_violations || [])]
      .forEach(vi => { vCounts[vi.type] = (vCounts[vi.type] || 0) + 1; });
  });
  const topV = Object.entries(vCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const catBars = Object.entries(catCounts).sort((a,b)=>b[1]-a[1]).map(([cat, cnt]) => `
    <div style="font-size:11px;margin-bottom:2px">${esc(cat)} <span style="color:var(--muted)">(${cnt})</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${(cnt/catMax*100).toFixed(1)}%">${cnt}</div></div>
  `).join('');

  const topVHtml = topV.length ? topV.map(([t, c]) =>
    `<div class="stat-row"><span class="sk">${esc(t)}</span><span>${c}</span></div>`
  ).join('') : '<div style="color:var(--muted);font-size:11px">None</div>';

  document.getElementById('stats-panel').innerHTML = `
    <h2>Run Statistics</h2>
    <div class="stat-row"><span class="sk">Total tasks</span><span>${n}</span></div>
    <div class="stat-row"><span class="sk">Validity rate</span><span>${validRate}%</span></div>
    <div class="stat-row"><span class="sk">Avg direct F1</span><span>${avgDirect}</span></div>
    <div class="stat-row"><span class="sk">Avg closure F1</span><span>${avgClosure}</span></div>
    <div style="margin-top:16px"><h3 style="font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:8px">Category Distribution</h3>
      ${catBars}
    </div>
    <div style="margin-top:16px"><h3 style="font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:8px">Top Violation Types</h3>
      ${topVHtml}
    </div>
  `;
}

/* ─────────────────────────────────────────────────────────────────
   Utilities
───────────────────────────────────────────────────────────────── */
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function truncate(s, n) {
  return s.length > n ? s.slice(0, n - 1) + '…' : s;
}

function fmtF1(v) {
  if (v == null) return '—';
  return Number(v).toFixed(3);
}
</script>
